
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: vismaya-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - vismaya-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismaya-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
      TRUST_PROXY_HOPS: 1
      BROADCAST_EMBEDDED_WORKER: "false"
    expose:
      - "5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vismaya-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vismaya-worker
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      BROADCAST_EMBEDDED_WORKER: "false"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vismaya-network

  redis:
    image: redis:7-alpine
    container_name: vismaya-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vismaya-network


  rustfs:
    image: rustfs/rustfs:latest-glibc
    user: "10001:10001"
    container_name: vismaya-rustfs
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - vismaya-network


  nginx:
    image: nginx:alpine
    container_name: vismaya-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vismaya-network

volumes:
  redis_data:
  rustfs_data:

networks:
  vismaya-network:
    driver: bridge
